[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fastdps"
version = "0.1.0"
description = "Open-source, chat-first dynamic purchasing system"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
  "python-fasthtml>=0.12.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "google-auth>=2.0.0",
  "requests>=2.31.0",
  "psycopg[binary,pool]>=3.2.0",
  "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.9.0"]
ocds-converter = [
  "ted-and-doffin-to-ocds @ git+https://github.com/bjornjorgensen/TED-and-Doffin-to-ocds.git@116d01bf84d8c3c3118bf15973a1d781bc5cd1cf"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 140

[tool.ruff.lint]
select = ["F"]
ignore = ["F403", "F405"] # FastHTML's supported convenience API is a star export.

[tool.setuptools.packages.find]
include = ["fastdps*"]
